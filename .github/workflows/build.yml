name: build-app

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Build (framework-dependent)
        run: dotnet build BiosFlasher.csproj -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish BiosFlasher.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiosFlasher-win-x64
          path: dist/BiosFlasher.exe
          if-no-files-found: error
